name: ML Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-forecasting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ML test dependencies
        run: python -m pip install -r ml/requirements-test.txt

      - name: Run ML tests
        run: python -m pytest ml/tests/ -v
